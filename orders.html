<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Customer orders list with approval, cancel and archive tools for sekmung admin.">
  <meta name="author" content="Muhammad Amar Danial Bin Nazar"
  <title>Orders | sekmung admin</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">

  <div id="navbar"></div>

  <main class="container page-main">
    <h1 class="page-title">Orders</h1>
    <p class="text-muted-custom mb-4">All customer orders and their current status.</p>

    <!-- Search and filter -->
    <div class="row g-2 mb-3 align-items-center">
      <div class="col-md-6">
        <input type="text" id="searchBox" class="form-control" placeholder="Search by order ID, customer or design">
      </div>
      <div class="col-md-3">
        <select id="statusFilter" class="form-select">
          <option value="All">All statuses</option>
        </select>
      </div>
      <div class="col-md-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="showArchived">
          <label class="form-check-label text-muted-custom" for="showArchived">Show archived</label>
        </div>
      </div>
    </div>

    <!-- Orders table -->
    <div class="card-box">
      <div class="table-responsive">
        <table class="table app-table align-middle mb-0">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Product</th>
              <th>Design</th>
              <th>Size</th>
              <th>Qty</th>
              <th>Deadline</th>
              <th>Price</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </div>
    <p id="resultCount" class="text-muted-custom mt-2 small"></p>

    <div id="statusToast" class="status-toast d-none"></div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/data.js"></script>
  <script>renderLayout("orders");</script>
  <script src="js/orders.js"></script>
</body>
</html>
