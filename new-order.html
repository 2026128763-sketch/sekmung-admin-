<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Design and place a new custom merchandise order at sekmung.">
  <meta name="author" content="Muhammad Amar Danial Bin Nazar">
  <title>New Order | sekmung</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">

  <div id="navbar"></div>

  <main class="container page-main">
    <h1 class="page-title">New Order</h1>
    <p class="text-muted-custom mb-4">Choose your product, pick a colour and see how it will look.</p>

    <div class="row g-4">
      <!-- Live preview -->
      <div class="col-lg-6 order-lg-2">
        <div class="card-box p-3 preview-sticky">
          <div class="preview-stage" id="previewStage"></div>
          <div class="d-flex justify-content-between align-items-end mt-3">
            <div>
              <div class="text-muted-custom small">Your selection</div>
              <strong id="previewTitle">T-shirt &middot; Black</strong>
            </div>
            <div class="text-end">
              <div class="text-muted-custom small">Estimated price</div>
              <strong id="priceEstimate">RM 0.00</strong>
            </div>
          </div>
        </div>
      </div>

      <!-- Order form -->
      <div class="col-lg-6 order-lg-1">
        <div class="card-box p-4">
          <div id="orderError" class="alert alert-danger d-none" role="alert"></div>

          <form id="orderForm" novalidate>
            <label class="form-label">Choose product</label>
            <div class="product-cards mb-4" id="productCards"></div>

            <label class="form-label">Colour</label>
            <div class="swatches mb-4" id="swatches"></div>

            <div class="row g-3">
              <div class="col-md-6">
                <label for="size" class="form-label">Size</label>
                <select id="size" class="form-select">
                  <option>S</option>
                  <option>M</option>
                  <option>L</option>
                  <option>XL</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="qty" class="form-label">Quantity</label>
                <input type="number" id="qty" class="form-control" value="1" min="1" max="500">
              </div>
              <div class="col-12">
                <label for="design" class="form-label">Design name</label>
                <input type="text" id="design" class="form-control" placeholder="e.g. Wave Logo" maxlength="30">
              </div>
              <div class="col-12">
                <label for="deadline" class="form-label">Needed by</label>
                <input type="date" id="deadline" class="form-control">
                <div class="form-text text-muted-custom" id="deadlineHint"></div>
              </div>
            </div>

            <button type="submit" class="btn btn-light w-100 mt-4">Place order</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mockup.js"></script>
  <script>renderLayout("neworder");</script>
  <script src="js/new-order.js"></script>
</body>
</html>
