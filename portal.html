<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Customer portal to track custom orders at sekmung.">
  <meta name="author" content="Muhammad Amar Danial Bin Nazar">
  <title>My Orders | sekmung</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">

  <div id="navbar"></div>

  <main class="container page-main">
    <h1 class="page-title" id="welcome">My Orders</h1>
    <p class="text-muted-custom mb-4">Track your custom orders from payment to delivery.</p>

    <!-- Summary cards -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3">
        <div class="stat-card"><p class="stat-label">Total orders</p><p class="stat-value" id="statTotal">0</p></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card"><p class="stat-label">In progress</p><p class="stat-value" id="statProgress">0</p></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card"><p class="stat-label">Delivered</p><p class="stat-value" id="statDelivered">0</p></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card"><p class="stat-label">Total spent</p><p class="stat-value" id="statSpent">RM 0</p></div>
      </div>
    </div>

    <!-- Current order with step tracker -->
    <div class="card-box p-3 p-md-4 mb-4" id="latestCard"></div>

    <!-- Orders table -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h2 class="section-title mb-0">Your orders</h2>
      <a href="new-order.html" class="btn btn-light btn-sm">+ New order</a>
    </div>
    <div class="card-box">
      <div class="table-responsive">
        <table class="table app-table align-middle mb-0">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Product</th>
              <th>Design</th>
              <th>Size</th>
              <th>Qty</th>
              <th>Deadline</th>
              <th>Price</th>
              <th>Status</th>
              <th>Progress</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="myOrdersBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mockup.js"></script>
  <script>renderLayout("portal");</script>
  <script src="js/portal.js"></script>
</body>
</html>
