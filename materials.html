<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Materials, suppliers and stock levels for sekmung admin.">
  <meta name="author" content="Muhammad Amar Danial Bin Nazar">
  <title>Materials | sekmung admin</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">

  <div id="navbar"></div>

  <main class="container page-main">
    <h1 class="page-title">Materials</h1>
    <p class="text-muted-custom mb-4">Stock levels and suppliers for blanks, ink, labels and packaging.</p>

    <!-- Search and category filter -->
    <div class="row g-2 mb-3">
      <div class="col-md-8">
        <input type="text" id="searchBox" class="form-control" placeholder="Search by item or supplier">
      </div>
      <div class="col-md-4">
        <select id="categoryFilter" class="form-select">
          <option value="All">All categories</option>
        </select>
      </div>
    </div>

    <!-- Materials table -->
    <div class="card-box">
      <div class="table-responsive">
        <table class="table app-table align-middle mb-0">
          <thead>
            <tr>
              <th>Item</th>
              <th>Category</th>
              <th>Supplier</th>
              <th>Stock</th>
              <th>Reorder level</th>
              <th>Unit cost</th>
              <th>Stock status</th>
              <th>Adjust stock</th>
            </tr>
          </thead>
          <tbody id="materialsBody"></tbody>
        </table>
      </div>
    </div>
    <p id="resultCount" class="text-muted-custom mt-2 small"></p>

    <!-- Stock activity -->
    <div class="card-box p-3 mt-4">
      <h2 class="section-title">Recent stock activity</h2>
      <div id="stockLogList"></div>
    </div>

    <div id="stockToast" class="status-toast d-none"></div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/data.js"></script>
  <script>renderLayout("materials");</script>
  <script src="js/materials.js"></script>
</body>
</html>
